<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dennis "Consular" Johnson</title>
    <meta name="description" content="Dennis &quot;Consular&quot; Johnson: mod and game developer, Midway University class of 2028.">
    <meta property="og:title" content="Dennis &quot;Consular&quot; Johnson">
    <meta property="og:description" content="Mod and game developer. Midway University, class of 2028.">
    <meta property="og:image" content="https://consularatol.github.io/potato_mane_happy.png">
    <meta name="theme-color" content="#f3efe6">
    <link rel="icon" href="potato_mane_happy.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f3efe6;
            --card: #ffffff;
            --text: #1d1b18;
            --muted: #6b665e;
            --border: #e6e0d4;
            --accent: #8a6d3b;
            --accent-soft: #f1e8d6;
            --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(60,45,20,.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #151413;
                --card: #1f1d1b;
                --text: #f2eee8;
                --muted: #a39d93;
                --border: #2f2c28;
                --accent: #d2b37a;
                --accent-soft: #2b261e;
                --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 64px 16px 48px;
        }

        /* Business card */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px 32px 32px;
            text-align: center;
        }
        .avatar {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: var(--accent-soft);
            padding: 10px;
            object-fit: contain;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        h1 .nick { color: var(--accent); }
        .role {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 1rem;
        }
        .edu {
            display: inline-block;
            margin-top: 14px;
            padding: 4px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .email {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 28px 0 12px;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--text);
            color: var(--card);
            font-weight: 600;
            text-decoration: none;
            overflow-wrap: anywhere;
            transition: opacity .15s ease;
        }
        .email:hover { opacity: .88; }

        .links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .links a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 8px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: border-color .15s ease, transform .15s ease;
        }
        .links a:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .links svg { width: 22px; height: 22px; fill: currentColor; }
        .email svg { width: 18px; height: 18px; flex-shrink: 0; fill: currentColor; }

        /* Work gallery */
        .work { margin-top: 48px; }
        .work h2 {
            margin: 0 0 16px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            text-align: center;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .gallery a {
            display: block;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
        }
        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 6px;
            transition: transform .25s ease;
        }
        .gallery a:hover img { transform: scale(1.06); }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
        }

        @media (max-width: 420px) {
            main { padding-top: 32px; }
            .card { padding: 32px 20px 20px; }
            .email { font-size: 0.9rem; padding: 12px; }
            .links { grid-template-columns: repeat(2, 1fr); }
            .gallery { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
